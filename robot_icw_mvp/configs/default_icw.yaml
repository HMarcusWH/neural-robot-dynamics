# Default slider configuration for the ICW adapter.
# The values mirror the qualitative defaults described in the design note
# and act as a safe starting point for experiments.
rungs: [128, 256, 512]
default_backend: ground-truth
intuition:
  tau_lo: 0.08
  tau_hi: 0.15
  abstain_quantile: 0.95
  residual_window: 2048
creativity:
  max_branches: 2
  rupture_threshold: 0.2
wisdom:
  disc_weight: 1.0
  rupture_weight: 0.5
safety:
  torque_limit_scale: 1.1
